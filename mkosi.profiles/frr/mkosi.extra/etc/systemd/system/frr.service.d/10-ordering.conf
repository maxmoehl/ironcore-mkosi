[Unit]
# Boot chain: bgpd must not come up before configure-frr rendered frr.conf
# from metaldata, and network-online (which configure-frr is WantedBy, and
# which orders the libvirt-provider/machinepoollet units) only completes
# once FRR is started:
#   systemd-networkd-wait-online -> configure-frr -> frr -> network-online
After=configure-frr.service
Before=network-online.target
