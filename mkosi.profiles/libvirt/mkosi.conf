[Content]
# Reserve the hugepage pool for the libvirt VMs at boot (libvirt-provider
# runs with --enable-hugepages=true and gates all scheduling on it).
# Mirrors the existing hypervisors: 1800 x 1 GiB. The provider reads the
# pool from /proc/meminfo, which only tracks the *default* hugepage size,
# hence default_hugepagesz=1G must accompany hugepagesz=1G or the pool
# capacity reports as 0.
KernelCommandLine=
    hugepagesz=1G
    hugepages=1800
    default_hugepagesz=1G
Packages=
    libvirt-daemon-system
    libvirt-clients
    qemu-utils
    ceph-common
    qemu-block-extra
    pci.ids
BuildPackages=
    git
    golang-go

[Build]
WithNetwork=yes
