# Mirrors the users/groups the libvirt-provider DaemonSet checks in its
# check-prerequisites init container.
#
# libvirt-provider runs as this user and reaches the libvirt system socket
# via the libvirt group. libvirt-qemu (created by libvirt-daemon-system at
# build time) is made a member of libvirt-provider so qemu can read the
# disk images and ignition configs under /var/lib/libvirt-provider.
u libvirt-provider 65532 "IronCore libvirt-provider" /var/lib/libvirt-provider /usr/sbin/nologin
g libvirt-provider 65532
m libvirt-provider libvirt
m libvirt-qemu libvirt-provider
