d /var/lib/libvirt-provider 0755 libvirt-provider libvirt-provider -
# /var/inisix must be writable by libvirt-provider: 'inisix init prefix'
# (init-inisix.service) creates the store file /var/inisix/prefixes.json
# there and the lock is an flock on the store file itself.
d /var/inisix 0755 libvirt-provider libvirt-provider -
d /var/lib/machinepoollet 0700 root root -
