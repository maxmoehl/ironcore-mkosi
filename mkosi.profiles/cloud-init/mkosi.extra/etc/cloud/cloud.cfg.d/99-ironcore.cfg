# Register the out-of-tree IronCore datasource (installed alongside this
# file in /usr/lib/python3/dist-packages/ironcore_cloudinit).
#
# datasource_list is intentionally not set here: the datasource is pinned
# per platform with `ds=<name>` on the kernel command line, see
# mkosi.conf.d/{metal,virt}.conf in this profile.
datasource_pkg_list: [ ironcore_cloudinit.sources ]

# Networking is managed by systemd-networkd (99-default.network).
network:
  config: disabled

# Do not create the distribution's default user; users are expected to
# come from user-data.
users: []
